<!DOCTYPE html>
<!-- ======================================================================
     JABALPUR OPTICALS — index.html
     This ONE file is the whole website front end. It has three parts:
       1. <style>   -> CSS: how everything looks (colours, sizes, animations)
       2. <body>    -> HTML: the structure (nav, hero, sections, form, footer)
       3. <script>  -> JavaScript: all the behaviour (animations, tabs, form)
     ====================================================================== -->
<!-- Tells the browser "this page is written in modern HTML5". -->
<html lang="en"> <!-- Root element. lang="en" = page language is English (helps screen readers). -->
<head> <!-- Invisible information about the page (not shown on screen). -->
<meta charset="utf-8"> <!-- Character set: lets the page show symbols like © and ₹ correctly. -->
<!-- Viewport: makes the page fit a phone screen instead of shrinking a desktop layout.
     viewport-fit=cover lets the page use the full screen on phones with a notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jabalpur Opticals</title> <!-- Text shown on the browser tab. -->
<!-- Start connecting to Google's font servers early so the fonts load faster. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load two fonts: "Anton" (big headings) and "Instrument Sans" (body text). -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS — STYLE SHEET
   CSS has "rules". Each rule = a selector (WHAT to style) + { declarations
   (HOW to style it) }.  Example:  h1 { color: red; }  makes every h1 red.
   ========================================================================== */

/* :root = the whole page. Here we store colours/fonts as VARIABLES.
   Writing var(--gold) anywhere below uses the value defined here, so
   changing it once changes the whole site. */
:root{
  color-scheme: dark;                 /* tells the browser this is a dark page (dark scrollbars etc.) */
  --bg:#000;                          /* page background: black */
  --ink:#efe8d8;                      /* main text colour: warm off-white */
  --muted:#a39b87;                    /* softer grey-gold for less important text */
  --gold:#e6b24c;                     /* main gold colour */
  --gold-hi:#f7e2a6;                  /* light gold (highlights) */
  --gold-lo:#9a6a1c;                  /* dark gold (shadows) */
  --line:rgba(230,178,76,.24);        /* thin border colour: see-through gold */
  --panel:rgba(10,8,3,.62);           /* dark see-through background for cards */
  --display:'Anton','Impact','Arial Narrow',sans-serif; /* heading font, with backups if Anton fails to load */
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; /* body font + backups */
  box-sizing:border-box;              /* width includes padding+border (easier maths) */
  padding-top:env(safe-area-inset-top,0px);       /* keep content below a phone notch */
  padding-bottom:env(safe-area-inset-bottom,0px); /* keep content above the phone's bottom bar */
}
html{
  scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem); /* when a link jumps to a section, leave room for the nav bar */
  scroll-behavior:smooth;             /* clicking menu links scrolls smoothly, not instantly */
}
*,*::before,*::after{box-sizing:border-box} /* apply border-box to EVERY element */
body{
  margin:0;                           /* remove the browser's default outer gap */
  background:var(--bg);               /* black page background */
  color:var(--ink);                   /* default text colour */
  font-family:var(--body);            /* default font */
  line-height:1.65;                   /* space between lines of text */
  overflow-x:hidden;                  /* OLD browsers: hide sideways overflow */
  overflow-x:clip;                    /* NEW browsers: same, but WITHOUT breaking "sticky" on phones (mobile fix) */
  -webkit-font-smoothing:antialiased; /* smoother text on Mac/iPhone */
}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px} /* gold outline when using the keyboard (accessibility) */
a{color:inherit}                      /* links take the surrounding text colour */

/* ---------- moving background (the <canvas> that JS paints on) ---------- */
#bg{
  position:fixed;                     /* stays in place while the page scrolls */
  top:0;right:0;bottom:0;left:0;      /* stretch to all four edges (works on old phones too) */
  width:100%;height:100%;             /* full screen size */
  z-index:0;                          /* sits at the very back */
  pointer-events:none;                /* clicks pass through it to things in front */
  display:block;                      /* removes a small gap canvases get by default */
}

/* ---------- nav (top menu bar) ---------- */
#nav{
  position:fixed;top:0;left:0;right:0;z-index:20; /* glued to the top, above everything */
  display:flex;align-items:center;justify-content:space-between;gap:1rem; /* logo left, links right */
  padding:calc(env(safe-area-inset-top,0px) + .9rem) 5vw 1.6rem;           /* inner spacing */
  background:linear-gradient(#000 20%,rgba(0,0,0,0)); /* black fading to see-through, so text stays readable */
  transform:translateY(-110%);        /* starts hidden ABOVE the screen */
  transition:transform .5s cubic-bezier(.2,.7,.2,1);  /* slides in smoothly when shown */
}
#nav.show{transform:none}             /* JS adds class "show" -> nav slides down into view */
#nav .logo{font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;color:var(--gold-hi)} /* shop name in the nav */
#nav .links{display:flex;gap:1.6rem;font-size:.95rem}   /* menu links in a row */
#nav .links a{text-decoration:none;color:var(--muted);transition:color .2s} /* grey links, no underline */
#nav .links a:hover{color:var(--gold-hi)}                /* turn light gold on hover */
#nav .links a.admin-link{border:1px solid var(--line);border-radius:999px;padding:.15rem .9rem;color:var(--gold-hi)} /* "Shop login" looks like a small outlined pill */
#nav .links a.admin-link:hover{border-color:var(--gold)} /* brighter border on hover */
@media(max-width:560px){ /* rules inside only apply on narrow (phone) screens */
  #nav .links{gap:1rem;font-size:.85rem}  /* tighter links on phones */
  #nav .logo{font-size:1.1rem}            /* smaller logo on phones */
  #nav .links a.admin-link{display:none}  /* hide the pill on phones; the footer has the same link */
}

/* ---------- hero (the scroll-zoom intro) ----------
   #hero is made VERY tall (390% of screen height). Inside it, .stage is
   "sticky": it stays glued to the screen while you scroll through that
   extra height. The JavaScript reads how far you have scrolled and uses it
   to zoom the spectacles. */
#hero{position:relative;z-index:1;height:390vh;height:390svh} /* tall scroll track (svh = stable "small viewport" height on phones) */
#hero .stage{
  position:sticky;top:0;              /* glue to the top of the screen while scrolling through #hero */
  height:100vh;height:100svh;height:100dvh; /* one full screen tall; newer units override older ones */
  overflow:hidden;                    /* hide anything that zooms outside the screen */
}
/* BACKUP PINNING (mobile fix): if a phone browser breaks "sticky", the JS adds one of
   these classes and pins the stage itself. Normal desktop never uses them. */
#hero .stage.js-top{position:absolute;top:0;bottom:auto;left:0;right:0}   /* before the zoom starts: sit at the top of #hero */
#hero .stage.js-fixed{position:fixed;top:0;bottom:auto;left:0;right:0}    /* during the zoom: stay fixed on screen */
#hero .stage.js-done{position:absolute;top:auto;bottom:0;left:0;right:0}  /* after the zoom: rest at the bottom of #hero and scroll away */
#hero .stage::after{ /* a dark "vignette" layer over the hero (darker edges, brighter middle) */
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 42%,rgba(0,0,0,.7) 100%);
}
#glasses{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;display:block} /* the SVG spectacles fill the whole stage */
.glow{ /* warm gold glow that fades in as you zoom into the lens */
  position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;opacity:0; /* starts invisible; JS raises opacity */
  background:radial-gradient(circle at 50% 50%,rgba(230,178,76,.28),rgba(230,178,76,.06) 38%,transparent 62%);
}
.brand{ /* holds the shop name + tagline, centred on the screen */
  position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;
  display:grid;place-content:center;justify-items:center;text-align:center; /* centre horizontally AND vertically */
  padding:0 5vw;pointer-events:none;
}
.brand h1{ /* the big shop name */
  margin:0;font-family:var(--display);font-weight:400;
  font-size:clamp(3.6rem,11vw,9rem);  /* clamp(min, preferred, max): grows with screen width but never too small/big */
  line-height:1;letter-spacing:.01em;text-transform:uppercase;
}
.word{display:inline-block;white-space:nowrap} /* each word stays on one line */
.ch{ /* ONE LETTER of the shop name (JS wraps every letter in a span with this class) */
  display:inline-block;opacity:0;     /* letters start invisible; JS fades them in */
  background:linear-gradient(100deg,#9a6a1c 0%,#e6b24c 25%,#fff3c9 50%,#e6b24c 75%,#9a6a1c 100%); /* gold gradient... */
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;  /* ...shown only INSIDE the letter shapes */
  color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s linear infinite;animation-delay:calc(var(--i) * -.16s); /* shimmer, offset per letter */
}
@keyframes shine{from{background-position:150% 0}to{background-position:-150% 0}} /* moves the gradient sideways = shimmer */
.brand p{margin:1.2rem 0 0;max-width:34ch;font-size:clamp(1rem,2.2vw,1.25rem);color:var(--ink);opacity:0} /* tagline; JS fades it in */
.hint{ /* "Scroll to step inside" text at the bottom of the hero */
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2rem);z-index:3;
  text-align:center;color:var(--muted);font-size:.95rem;pointer-events:none;
}
.hint i{ /* the thin line under the hint that "drips" downwards */
  display:block;width:1px;height:38px;margin:.7rem auto 0;
  background:linear-gradient(var(--gold),transparent);
  animation:drip 1.8s ease-in-out infinite;transform-origin:top;
}
@keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}} /* line grows then fades */
.sweep{animation:sweep 7s ease-in-out infinite} /* the shiny glare streak on the lenses */
@keyframes sweep{0%,55%{transform:translateX(-260px)}100%{transform:translateX(320px)}} /* glare slides across */

/* ---------- sections (About, Gallery, Visit, Enquiry) ---------- */
main{position:relative;z-index:1}     /* main content sits above the background canvas */
.sec{max-width:1180px;margin:0 auto;padding:clamp(4.5rem,10vw,8.5rem) 6vw} /* centred column with generous top/bottom space */
.sec h2{ /* section titles in gold gradient text */
  margin:0 0 1rem;font-family:var(--display);font-weight:400;
  font-size:clamp(2.6rem,7vw,5rem);line-height:1;text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sec .intro{margin:0 0 2.4rem;max-width:56ch;color:var(--muted);font-size:1.1rem} /* grey intro line under a title */

/* ---------- tabs (About section) ---------- */
.tablist{position:relative;display:flex;gap:clamp(1.2rem,4vw,2.6rem);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none} /* row of tab buttons; scrolls sideways on small screens */
.tablist::-webkit-scrollbar{display:none} /* hide the scrollbar in Chrome/Safari */
.tab{appearance:none;background:none;border:0;padding:.9rem 0;font:600 1.05rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s} /* a tab button */
.tab:hover{color:var(--ink)}                   /* brighter on hover */
.tab[aria-selected="true"]{color:var(--gold-hi)} /* the active tab is light gold */
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--gold);transition:transform .38s cubic-bezier(.3,.8,.2,1),width .38s cubic-bezier(.3,.8,.2,1)} /* gold underline that slides under the active tab */
.panel{ /* the card showing the active tab's content */
  position:relative;margin-top:1.6rem;padding:clamp(1.5rem,4.5vw,3.2rem);
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px); /* blur whatever is behind (frosted glass) */
  display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(1.5rem,5vw,4rem); /* two columns: text | list */
  overflow:hidden;--mx:50%;--my:0%;   /* --mx/--my = mouse position, updated by JS for the spotlight */
}
.panel::before{ /* the soft spotlight that follows the mouse */
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:radial-gradient(520px circle at var(--mx) var(--my),rgba(230,178,76,.16),transparent 60%);
  transition:opacity .3s;
}
.panel>*{position:relative}           /* keep the panel's content above the spotlight layer */
.panel h3{margin:0 0 .9rem;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05;text-transform:uppercase;color:var(--ink)} /* tab heading */
.panel p{margin:0 0 1rem;color:var(--muted);max-width:52ch}   /* tab paragraph */
.rows{list-style:none;margin:0;padding:0;align-self:start}   /* the list on the right of the panel (no bullets) */
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:1.2rem;padding:.95rem 0;border-bottom:1px solid var(--line);animation:rowIn .45s cubic-bezier(.2,.7,.2,1) both} /* each row: title left, note right; fades in */
.rows li:first-child{padding-top:0}    /* no extra space above the first row */
.rows b{font-weight:600;font-size:1.05rem}                    /* row title */
.rows span{color:var(--muted);text-align:right;font-size:.98rem} /* row note */
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}} /* rows rise and fade in */
@media(max-width:820px){.panel{grid-template-columns:1fr}}    /* on tablets/phones stack the panel into one column */

/* ---------- gallery (shop photos) ----------
   Each photo is a <figure>. If an image file is missing, the <img>'s onerror
   adds class "ph" to the figure and these rules show a dashed placeholder. */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem} /* as many 220px+ columns as fit */
.gallery-grid figure{position:relative;margin:0;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)} /* photo card, 4:3 shape */
.gallery-grid img{width:100%;height:100%;object-fit:cover;display:block} /* photo fills the card, cropped (not stretched) */
.gallery-grid figcaption{position:absolute;left:.8rem;bottom:.8rem;padding:.35rem .75rem;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid var(--line);font-size:.8rem;color:var(--gold-hi)} /* small caption badge */
.gallery-grid .ph-label{display:none}                         /* placeholder text hidden normally */
.gallery-grid figure.ph{border-style:dashed}                  /* placeholder card has a dashed border */
.gallery-grid figure.ph img{display:none}                     /* hide the broken image */
.gallery-grid figure.ph figcaption{display:none}              /* hide the caption on placeholders */
.gallery-grid figure.ph .ph-label{display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:1.2rem;color:var(--muted);font-size:.85rem;line-height:1.5} /* show the "add your photo" text */
.gallery-grid figure.ph .ph-label code{display:block;margin-top:.4rem;color:var(--gold-hi);font-size:.85rem} /* file name shown in gold */

/* ---------- visit (address + map) ---------- */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:start} /* details left, map right */
address{font-style:normal;font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.4;margin-bottom:1.8rem} /* <address> is italic by default; we make it normal */
.contact{list-style:none;margin:0 0 2rem;padding:0}           /* contact list without bullets */
.contact li{display:flex;gap:1.2rem;padding:.75rem 0;border-bottom:1px solid var(--line)} /* label + value in a row */
.contact li>span{flex:0 0 6.2rem;color:var(--muted)}          /* fixed-width grey label (Phone, Email...) */
.contact a{text-decoration:none}                              /* no underline on contact links */
.contact a:hover{color:var(--gold-hi)}                        /* highlight on hover */
.btns{display:flex;flex-wrap:wrap;gap:.8rem}                  /* buttons in a row that wraps on small screens */
.btn{display:inline-block;appearance:none;border:1px solid var(--gold);border-radius:10px;padding:.85rem 1.5rem;font:600 1rem var(--body);text-decoration:none;cursor:pointer;color:var(--gold-hi);background:transparent;transition:background .2s,color .2s,transform .15s} /* outlined button */
.btn:hover{background:rgba(230,178,76,.12)}                   /* faint gold fill on hover */
.btn:active{transform:translateY(1px)}                        /* tiny "press" movement when clicked */
.btn.solid{background:linear-gradient(120deg,var(--gold-hi),var(--gold) 55%,#c98f2a);color:#1a1204;border-color:transparent} /* filled gold button */
.btn.solid:hover{background:linear-gradient(120deg,#fff3c9,#f0c060 55%,#d99b30)} /* lighter gold on hover */
.mapcard{display:block;position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;background:#090703} /* the clickable map picture */
.mapcard svg{position:absolute;top:0;left:0;width:100%;height:100%} /* drawn map fills the card */
.mapcard .cap{position:absolute;left:1rem;bottom:1rem;padding:.5rem .9rem;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-size:.92rem;color:var(--gold-hi)} /* "Open in Google Maps" badge */
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite} /* the ring around the map pin */
@keyframes pulse{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.4);opacity:0}} /* ring grows and fades */
@media(max-width:820px){.visit{grid-template-columns:1fr}}    /* stack details and map on small screens */

/* ---------- enquiry form ---------- */
.enq{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,6vw,5rem);align-items:start} /* title left, form right */
form{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.2rem;padding:clamp(1.3rem,4vw,2.4rem);border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)} /* form card, two columns */
.field{display:flex;flex-direction:column;gap:.4rem}           /* label above input */
.field.full{grid-column:1/-1}                                  /* this field spans both columns */
label{font-size:.95rem;color:var(--muted)}                     /* field label text */
input,select,textarea{width:100%;font:400 1rem var(--body);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:.85rem 1rem;transition:border-color .2s,background .2s} /* all form fields share this look */
input:hover,select:hover,textarea:hover{border-color:rgba(230,178,76,.5)} /* brighter border on hover */
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(230,178,76,.06);outline:none;box-shadow:0 0 0 3px rgba(230,178,76,.2)} /* gold glow while typing */
select option{background:#100c04;color:var(--ink)}             /* dropdown list colours */
textarea{min-height:120px;resize:vertical}                     /* message box can be resized up/down only */
.status{grid-column:1/-1;margin:0;min-height:1.4em;color:var(--gold-hi);font-size:.97rem} /* the success/error message under the form */
form .btn{justify-self:start}                                  /* send button aligned to the left */
@media(max-width:820px){.enq{grid-template-columns:1fr}}       /* one column on tablets */
@media(max-width:520px){form{grid-template-columns:1fr}}       /* one column of fields on phones */

/* ---------- footer ---------- */
footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:2.4rem 6vw calc(env(safe-area-inset-bottom,0px) + 2.4rem);text-align:center;color:var(--muted);font-size:.95rem;background:linear-gradient(transparent,rgba(0,0,0,.7))} /* bottom strip */
footer .foot-admin{margin-top:.8rem;font-size:.85rem}          /* "Shop keeper login" line */
footer .foot-admin a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)} /* subtle underlined link */
footer .foot-admin a:hover{color:var(--gold-hi)}               /* highlight on hover */
footer strong{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--gold-hi);display:block;margin-bottom:.3rem} /* shop name in footer */

/* ---------- reduced motion ----------
   Some people turn on "reduce motion" on their phone (or battery saver does it).
   We switch off only the CONTINUOUS decorative animations for them. The hero
   zoom is kept, because it moves only as the visitor scrolls (they control it). */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}                    /* no smooth scrolling */
  .ch,.hint i,.sweep,.pulse{animation:none}     /* stop shimmer, drip, glare and pulse loops */
  .rows li{animation:none}                      /* rows appear instantly */
}
</style>
</head>
<body id="top"> <!-- Everything visible goes inside <body>. id="top" lets the logo link jump back here. -->

<!-- Canvas = a blank drawing board. JavaScript paints the moving background on it. -->
<canvas id="bg" aria-hidden="true"></canvas> <!-- aria-hidden: screen readers skip it (it's decoration) -->

<!-- Navigation bar. It starts hidden and slides in when the hero zoom finishes. -->
<nav id="nav" aria-label="Main">
  <a class="logo" href="#top" id="navLogo">Jabalpur Opticals</a> <!-- shop name; JS fills it from SHOP.name -->
  <div class="links"> <!-- group of menu links -->
    <a href="#about">About</a>     <!-- jumps to the element with id="about" -->
    <a href="#gallery">Gallery</a> <!-- jumps to the photo gallery -->
    <a href="#visit">Visit</a>     <!-- jumps to address/map -->
    <a href="#enquiry">Enquiry</a> <!-- jumps to the form -->
    <!-- Shop keeper login: opens the PHP login page where the owner sees enquiries. -->
    <a href="php/login.php" class="admin-link">Shop login</a>
  </div>
</nav>

<!-- ============ HERO: scroll to zoom into the spectacles ============ -->
<header id="hero"> <!-- tall scroll track (see CSS) -->
  <div class="stage"> <!-- the screen-sized window that stays pinned while you scroll -->
    <!-- SVG = drawing made of shapes (stays sharp at any zoom). viewBox = which part of the drawing is visible;
         JS changes it on every frame, and that is what creates the zoom. -->
    <svg id="glasses" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A pair of gold spectacles">
      <defs> <!-- "definitions": reusable things (gradients, clip shapes) that are not drawn directly -->
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"> <!-- gold colour blend used on the frame -->
          <stop offset="0" stop-color="#fff0bd"/>  <!-- light gold at the start -->
          <stop offset=".4" stop-color="#e6b24c"/> <!-- main gold in the middle -->
          <stop offset="1" stop-color="#8a5a12"/>  <!-- dark gold at the end -->
        </linearGradient>
        <linearGradient id="lensFill" x1="0" y1="0" x2="1" y2="1"> <!-- faint gold tint inside the lenses -->
          <stop offset="0" stop-color="#e6b24c" stop-opacity=".16"/>
          <stop offset="1" stop-color="#e6b24c" stop-opacity=".02"/>
        </linearGradient>
        <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0"> <!-- soft white streak for the lens shine -->
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff6d8" stop-opacity=".3"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="clipL"><rect x="95" y="70" width="290" height="170" rx="70" ry="60"/></clipPath> <!-- left lens shape: glare is cut to this -->
        <clipPath id="clipR"><rect x="415" y="70" width="290" height="170" rx="70" ry="60"/></clipPath> <!-- right lens shape -->
      </defs>
      <g id="frameG"> <!-- group holding the whole spectacles drawing (JS fades it out as one unit) -->

<script>
/* ==========================================================================
   JAVASCRIPT — the behaviour of the page.
   Order of this script:
     1. SHOP        -> one object holding ALL editable text/content
     2. helpers     -> tiny reusable functions ($, clamp, smooth, ease, esc)
     3. fill content-> copies SHOP data into the empty HTML elements
     4. tabs / gallery / contact / form -> features that react to the user
     5. background  -> the animated canvas
     6. hero zoom   -> the scroll-driven zoom into the spectacles
   ========================================================================== */

// "const" makes a variable that cannot be re-assigned. SHOP is an OBJECT: a bundle of named values.
const SHOP = {
  name: "Jabalpur Opticals",                                   // shop name (used in many places)
  tagline: "Eye tests, frames and lenses, all under one roof.", // line shown under the name

  phone: "+91 00000 00000",                // phone number shown on the page
  whatsapp: "910000000000",                // WhatsApp number: country code + number, no + or spaces
  email: "hello@yourshop.com",             // email shown on the page
  hoursSummary: "Mon to Sat, 10:00 am to 9:00 pm", // one-line opening hours

  // Address: an ARRAY (list). Each item is printed on its own line.
  address: [
    "Tularam Chowk, Jabalpur Road",
    "Near Aaga Chowk",
    "Jabalpur - 482002, Madhya Pradesh"
  ],
  // The text typed into Google Maps' search box when someone taps "Get directions".
  mapsQuery: "Tularam Chowk, Jabalpur Road, Aaga Chowk, Jabalpur, Madhya Pradesh 482002",

  // Where the enquiry form sends its data.
  //  "php/enquiry.php" -> saves each enquiry into MySQL.
  //  ""                -> falls back to opening WhatsApp with a ready message.
  formEndpoint: "php/enquiry.php",

  // Titles and intro lines for each section.
  sections: {
    about:   { title: "About the shop", intro: "Write one line that tells visitors who you are." },
    gallery: { title: "Inside the shop", intro: "A quick look around the showroom." },
    visit:   { title: "Visit us",       intro: "Drop in any day. Walk-ins are welcome for eye tests." },
    enquiry: { title: "Send an enquiry", intro: "Tell us what you need and we will get back to you the same day." }
  },

  // Options shown in the "What are you looking for?" dropdown.
  enquiryOptions: ["Eye test", "New glasses", "Contact lenses", "Repair or adjustment", "Something else"],

  // Tabs in the About section. Each tab has: label, heading, text (a string OR a list of paragraphs), list of rows.
  tabs: [
    {
      label: "About",
      heading: "Our story",
      text: [
        "Write two or three lines about how the shop started and who you serve.",
        "Add what makes you different: years of experience, a qualified optometrist, a family-run team."
      ],
      list: [
        { title: "Serving Jabalpur since", note: "Add year" },
        { title: "Eye tests", note: "By a qualified optometrist" },
        { title: "Frames in stock", note: "Add a number" }
      ]
    },
    {
      label: "Services",
      heading: "What we do",
      text: "A short line about the services you offer.",
      list: [
        { title: "Eye testing", note: "Add details" },
        { title: "Spectacle frames", note: "Add details" },
        { title: "Lenses", note: "Single vision, progressive, blue-cut" },
        { title: "Contact lenses", note: "Add details" },
        { title: "Repairs and fitting", note: "Add details" }
      ]
    },
    {
      label: "Brands",
      heading: "Brands we stock",
      text: "List the frame and lens brands you carry.",
      list: [
        { title: "Brand one" }, { title: "Brand two" }, { title: "Brand three" }, { title: "Brand four" }
      ]
    },
    {
      label: "Hours",
      heading: "When to find us",
      text: "Change the timings below to match your shop.",
      list: [
        { title: "Monday to Saturday", note: "10:00 am to 9:00 pm" },
        { title: "Sunday", note: "11:00 am to 6:00 pm" }
      ]
    }
  ],

  // Shop photos. "src" = path of the image file inside the images folder.
  // If a file is missing, a dashed placeholder box is shown instead.
  gallery: [
    { src: "images/shop-1.jpg", alt: "Shop frontage", caption: "Shop front" },
    { src: "images/shop-2.jpg", alt: "Frames on display", caption: "Frames wall" },
    { src: "images/shop-3.jpg", alt: "Eye-testing area", caption: "Eye-test corner" }
  ]
};
/* ========================== end of editable block ========================= */


/* ------------------------------ 2. helpers ------------------------------ */
// $(selector): shortcut for document.querySelector — finds the first element matching a CSS selector.
const $ = s => document.querySelector(s);

// clamp(v, a, b): keeps number v between a (min) and b (max). Default range 0 to 1.
// Math.max(a, v) stops it going below a; Math.min(b, ...) stops it going above b.
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// smooth(t): turns a straight 0->1 ramp into a gentle S-curve (slow, fast, slow). Used for fades.
const smooth = t => t * t * (3 - 2 * t);

// ease(t): a stronger S-curve (ease-in-out). Used for the zoom speed: starts slow, speeds up, ends slow.
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// esc(text): "escapes" characters that mean something in HTML (< > & " ') by swapping them for safe codes.
// Prevents text from being treated as HTML code. (Uses == null instead of ?? so OLD phones understand it.)
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// reduce: true if the visitor's phone/computer has "reduce motion" switched on (accessibility / battery saver).
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// coarse: true on touch screens (phones/tablets), false on a mouse computer. Used for phone-friendly tweaks.
const coarse = matchMedia('(pointer: coarse)').matches;

/* ------------------------------ 3. fill content ------------------------------ */
// Copy values from SHOP into the empty HTML elements. textContent sets plain text (safe, no HTML).
document.title = SHOP.name;                         // browser tab title
$('#navLogo').textContent = SHOP.name;              // logo text in the nav
$('#footName').textContent = SHOP.name;             // shop name in the footer
$('#footLine').textContent = `© ${new Date().getFullYear()} ${SHOP.name}. All rights reserved.`; // copyright with the current year (backticks allow ${} inside text)
$('#tagline').textContent = SHOP.tagline;           // tagline under the hero name
// On touch screens, there is no "scroll wheel", so change the hint to say "Swipe up".
if (coarse) $('#hintText').textContent = 'Swipe up to step inside';

// Hero heading: wrap EVERY LETTER of the shop name in its own <span class="ch"> so each can fade in separately.
const h1 = $('#shopName');                          // the empty <h1>
h1.setAttribute('aria-label', SHOP.name);           // screen readers read the full name, not single letters
let letters = [];                                   // will hold every letter span so JS can animate them later
SHOP.name.split(' ').forEach((w, wi, arr) => {      // split the name into words; loop over each word
  const word = document.createElement('span');      // create a <span> to hold this word
  word.className = 'word';                          // give it the "word" CSS class (keeps letters together)
  word.setAttribute('aria-hidden', 'true');         // hide the broken-up letters from screen readers
  [...w].forEach(c => {                             // spread the word into single characters; loop over each
    const s = document.createElement('span');       // create a <span> for one letter
    s.className = 'ch';                             // "ch" = the shimmering letter style
    s.textContent = c;                              // put the letter inside
    s.style.setProperty('--i', letters.length);     // number the letter (0,1,2...) so CSS can offset its shimmer
    word.appendChild(s);                            // add the letter to the word
    letters.push(s);                                // remember it in the list
  });
  h1.appendChild(word);                             // add the finished word to the <h1>
  if (wi < arr.length - 1) h1.appendChild(document.createTextNode(' ')); // add a real space between words
});

// Section titles and intros.
$('#aboutTitle').textContent = SHOP.sections.about.title;
$('#aboutIntro').textContent = SHOP.sections.about.intro;
$('#galleryTitle').textContent = SHOP.sections.gallery.title;
$('#galleryIntro').textContent = SHOP.sections.gallery.intro;
$('#visitTitle').textContent = SHOP.sections.visit.title;
$('#visitIntro').textContent = SHOP.sections.visit.intro;
$('#enqTitle').textContent = SHOP.sections.enquiry.title;
$('#enqIntro').textContent = SHOP.sections.enquiry.intro;

/* ------------------------------ 4a. tabs (About section) ------------------------------ */
// This is an IIFE: a function that runs immediately, once. It keeps its variables private so they can't clash with others.
(function () {
  const list = $('#tablist'), panel = $('#panel');  // the tab bar and the content panel
  const ind = document.createElement('span');       // create the sliding gold underline element
  ind.className = 'ind';                            // style it with the "ind" CSS class
  list.appendChild(ind);                            // put it inside the tab bar

  // Build one <button> for every item in SHOP.tabs. .map() returns a new list of the buttons.
  const btns = SHOP.tabs.map((t, i) => {            // t = the tab data, i = its position (0,1,2...)
    const b = document.createElement('button');     // create the button
    b.className = 'tab';                            // style class
    b.type = 'button';                              // not a form-submit button
    b.role = 'tab';                                 // tells screen readers it's a tab
    b.id = 'tab' + i;                               // unique id: tab0, tab1...
    b.textContent = t.label;                        // the visible tab name
    b.setAttribute('aria-controls', 'panel');       // says which panel this tab controls
    b.addEventListener('click', () => select(i));   // when clicked, show this tab's content
    b.addEventListener('keydown', e => {            // keyboard support: arrow keys move between tabs
      if (e.key === 'ArrowRight') { e.preventDefault(); select((i + 1) % btns.length, true); }              // next tab (wraps to first)
      if (e.key === 'ArrowLeft') { e.preventDefault(); select((i - 1 + btns.length) % btns.length, true); } // previous tab (wraps to last)
    });
    list.insertBefore(b, ind);                      // place the button before the underline element
    return b;                                       // hand the button back into the btns list
  });

  // select(i): show tab number i. Marks the button active, redraws the panel, moves the underline.
  function select(i, focus) {
    const t = SHOP.tabs[i];                         // the data of the chosen tab
    btns.forEach((b, k) => { b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1; }); // only the chosen button is "selected" and keyboard-focusable
    panel.setAttribute('aria-labelledby', 'tab' + i); // panel is labelled by the chosen tab
    const paras = Array.isArray(t.text) ? t.text : [t.text]; // text can be one string or a list; make it always a list
    panel.innerHTML =                               // rebuild the panel's HTML:
      `<div><h3>${esc(t.heading)}</h3>${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>` + // heading + paragraphs (esc = safe)
      `<ul class="rows">${(t.list || []).map((r, k) =>                                          // list rows
        `<li style="animation-delay:${k * 60}ms"><b>${esc(r.title)}</b>${r.note ? `<span>${esc(r.note)}</span>` : ''}</li>`).join('')}</ul>`; // each row fades in slightly after the previous
    const b = btns[i];                              // the chosen button
    ind.style.width = b.offsetWidth + 'px';         // make the underline as wide as the button
    ind.style.transform = `translateX(${b.offsetLeft}px)`; // slide the underline under the button
    if (focus) b.focus();                           // move keyboard focus there if asked
  }
  select(0);                                        // show the first tab when the page loads

  // Re-position the underline if the window is resized or the custom font finishes loading (letter widths can change).
  const realign = () => { const cur = btns.findIndex(b => b.getAttribute('aria-selected') === 'true'); const b = btns[cur]; ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; };
  addEventListener('resize', realign);              // on window resize
  document.fonts && document.fonts.ready.then(realign); // when fonts are ready (the "&&" skips this on browsers without document.fonts)

  // Spotlight: store the mouse position inside the panel in CSS variables; the CSS gradient follows them.
  panel.addEventListener('pointermove', e => {
    const r = panel.getBoundingClientRect();        // panel's position on screen
    panel.style.setProperty('--mx', (e.clientX - r.left) + 'px'); // mouse X inside the panel
    panel.style.setProperty('--my', (e.clientY - r.top) + 'px');  // mouse Y inside the panel
  });
})();

/* ------------------------------ 4b. gallery (shop photos) ------------------------------ */
// Builds one <figure> photo card for every item in SHOP.gallery.
(function renderGallery() {
  const grid = $('#galleryGrid');                   // empty container in the HTML
  SHOP.gallery.forEach(g => {                       // loop over each photo entry
    const fig = document.createElement('figure');   // create the card
    fig.innerHTML =                                 // fill it with three pieces:
      `<img src="${esc(g.src)}" alt="${esc(g.alt)}" loading="lazy"
            onerror="this.closest('figure').classList.add('ph')">` +   // the photo; if the file is missing, add class "ph" to show the placeholder
      `<span class="ph-label">Add your photo here:<code>${esc(g.src)}</code></span>` + // placeholder text (hidden unless "ph")
      `<figcaption>${esc(g.caption)}</figcaption>`;                    // small caption
    grid.appendChild(fig);                          // put the card into the page
  });
})();

/* ------------------------------ 4c. address + contact details ------------------------------ */
$('#addr').innerHTML = SHOP.address.map(l => esc(l)).join('<br>'); // join the address lines with line breaks
// Google Maps search link. encodeURIComponent turns spaces/commas into URL-safe codes.
const mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(SHOP.mapsQuery);
$('#dirBtn').href = mapsUrl;                        // "Get directions" button link
$('#mapCard').href = mapsUrl;                       // the map picture link
// "tel:" links start a phone call on mobile. The regex removes everything except digits and "+".
const telHref = 'tel:' + SHOP.phone.replace(/[^+\d]/g, '');
$('#callBtn').href = telHref;                       // "Call the shop" button link
$('#contact').innerHTML =                           // build the contact list
  `<li><span>Phone</span><a href="${telHref}">${esc(SHOP.phone)}</a></li>` +
  `<li><span>WhatsApp</span><a href="https://wa.me/${esc(SHOP.whatsapp)}" target="_blank" rel="noopener">Chat with us</a></li>` +
  `<li><span>Email</span><a href="mailto:${esc(SHOP.email)}">${esc(SHOP.email)}</a></li>` +
  `<li><span>Open</span><div>${esc(SHOP.hoursSummary)}</div></li>`;

/* ------------------------------ 4d. enquiry form ------------------------------ */
// Fill the dropdown: one <option> per item in SHOP.enquiryOptions.
$('#f-need').innerHTML = SHOP.enquiryOptions.map(o => `<option>${esc(o)}</option>`).join('');

// When the form is submitted. "async" lets us use "await" to wait for the server's reply.
$('#form').addEventListener('submit', async e => {
  e.preventDefault();                               // stop the browser's normal submit (which would reload the page)
  const d = Object.fromEntries(new FormData(e.target)); // collect all fields into an object: {name, phone, need, message}
  const status = $('#status'), btn = $('#sendBtn'); // the message area and the send button
  // A ready-made WhatsApp message (only used by the fallback at the bottom).
  const text = `Hello ${SHOP.name}, my name is ${d.name}. I am looking for: ${d.need}.` +
               (d.message ? ` ${d.message}` : '') + ` My phone number is ${d.phone}.`;

  if (SHOP.formEndpoint) {                          // is a PHP file set? then use the database route
    btn.disabled = true;                            // stop double-clicks while sending
    status.textContent = 'Sending…';                // tell the visitor we're working
    try {                                           // "try" runs code that might fail
      const r = await fetch(SHOP.formEndpoint, {    // fetch = send a request to the server and wait
        method: 'POST',                             // POST = we are sending data
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, // we send and expect JSON
        body: JSON.stringify(d)                     // turn the data object into JSON text
      });
      const reply = await r.json();                 // read the server's JSON reply, e.g. {success:true}
      if (!r.ok || !reply.success) throw new Error(reply.error || 'bad status'); // treat a failed reply as an error
      status.textContent = 'Thank you. We will call you back soon.'; // success message
      e.target.reset();                             // clear the form
    } catch (err) {                                 // "catch" runs if anything above failed
      status.textContent = `Could not send the enquiry. Please call us on ${SHOP.phone}.`; // friendly error
    }
    btn.disabled = false;                           // re-enable the button
    return;                                         // stop here (skip the WhatsApp fallback)
  }

  // Fallback: no PHP set -> open WhatsApp with the message prepared.
  const url = `https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank', 'noopener');           // open in a new tab
  status.innerHTML = `Opening WhatsApp with your message. <a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Tap here if it did not open</a>.`;
});


/* ============================================================================
   5. MOVING BACKGROUND — a <canvas> painted behind everything.
   Each frame draws: a black fill, 3 soft glowing blobs, 2 swaying light
   beams, and floating dots that drift up and move away from the mouse.
   ============================================================================ */
const cv = $('#bg'), ctx = cv.getContext('2d');     // cv = the canvas; ctx = its "pen" for drawing in 2D
let W = 0, H = 0, DPR = 1, motes = [];              // W/H = screen size, DPR = pixel density, motes = the dots
const mouse = { x: -999, y: -999 };                 // mouse position; starts off-screen so nothing reacts yet

// Blobs. c = RGB colour, a = opacity, r = size, x/y = start position (0-1 of screen), ax/ay = how far it drifts, sx/sy = drift speed.
const blobs = [
  { c: '230,178,76', a: .16, r: .55, x: .25, y: .3, ax: .18, ay: .12, sx: .11, sy: .08 },
  { c: '150,96,20',  a: .22, r: .7,  x: .8,  y: .7, ax: .15, ay: .18, sx: .07, sy: .1 },
  { c: '255,226,150', a: .07, r: .4, x: .55, y: .5, ax: .3,  ay: .2,  sx: .05, sy: .06 }
];
// Beams. x = position across the screen, base = start angle, sw = swing amount, spread = fan width, a = opacity, sp = swing speed.
const beams = [
  { x: .3, base: .16, sw: .22, spread: .16, a: .13, sp: .23 },
  { x: .72, base: -.2, sw: .2, spread: .13, a: .09, sp: .17 }
];

// sizeCanvas(): sizes the canvas to the window and creates the floating dots. Runs at start and on resize.
function sizeCanvas() {
  if (W && innerWidth === W && Math.abs(innerHeight - H) < 150) return; // ignore tiny height changes (phone address bar hiding)
  DPR = coarse ? 1 : Math.min(devicePixelRatio || 1, 1.5); // phones use 1 pixel per pixel (faster); computers up to 1.5 (sharper)
  W = innerWidth; H = innerHeight;                  // current window size
  cv.width = W * DPR; cv.height = H * DPR;          // real canvas pixel size
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);           // scale drawing so we can use normal CSS-pixel coordinates
  const n = Math.round(clamp(W * H / (coarse ? 22000 : 15000), 30, 110)); // number of dots: bigger screen = more; fewer on phones
  motes = Array.from({ length: n }, () => ({        // create n dots, each with random properties:
    x: Math.random() * W, y: Math.random() * H,     // random start position
    r: .5 + Math.random() * 1.7,                    // random size
    vy: -(.04 + Math.random() * .2),                // upward speed (negative = up)
    vx: (Math.random() - .5) * .1,                  // tiny sideways drift
    ph: Math.random() * 6.28                        // random twinkle offset (6.28 = 2 x pi)
  }));
}
sizeCanvas();                                       // run once now
addEventListener('resize', sizeCanvas);             // and whenever the window changes size
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true }); // track the mouse (passive = never blocks scrolling)

// drawBg(t): draws ONE frame of the background. t = seconds since the page opened (makes movement continuous).
function drawBg(t) {
  ctx.globalCompositeOperation = 'source-over';     // normal drawing mode
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); // paint the whole canvas black (erases the previous frame)
  ctx.globalCompositeOperation = 'lighter';         // "lighter" = overlapping glows ADD together, like real light

  const L = Math.max(W, H);                         // the longer screen side, used to size blobs
  blobs.forEach((b, i) => {                         // draw each blob
    const x = W * (b.x + Math.sin(t * b.sx + i) * b.ax); // x position drifts left/right using a sine wave
    const y = H * (b.y + Math.cos(t * b.sy + i * 2) * b.ay); // y position drifts up/down using a cosine wave
    const r = L * b.r;                              // blob radius
    const g = ctx.createRadialGradient(x, y, 0, x, y, r); // a circular gradient: bright centre fading outwards
    g.addColorStop(0, `rgba(${b.c},${b.a})`);       // centre colour (with opacity)
    g.addColorStop(1, `rgba(${b.c},0)`);            // edge: fully transparent
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);    // paint the gradient
  });

  beams.forEach((b, i) => {                         // draw each light beam
    ctx.save();                                     // remember the current drawing state
    ctx.translate(W * b.x, -30);                    // move the pen to the beam's top point
    ctx.rotate(b.base + Math.sin(t * b.sp + i * 2) * b.sw); // tilt it; the sine makes it sway
    const len = H * 1.5, sp = len * b.spread;       // beam length and how wide it fans out
    const g = ctx.createLinearGradient(0, 0, 0, len); // gradient from top to bottom of the beam
    g.addColorStop(0, `rgba(255,226,150,${b.a})`);  // bright at the top
    g.addColorStop(1, 'rgba(255,226,150,0)');       // fades to nothing at the bottom
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(sp, len); ctx.lineTo(-sp, len); ctx.closePath(); ctx.fill(); // draw a long thin triangle
    ctx.restore();                                  // go back to the saved drawing state
  });

  motes.forEach(m => {                              // update and draw each floating dot
    const dx = m.x - mouse.x, dy = m.y - mouse.y, d2 = dx * dx + dy * dy; // distance (squared) from the mouse
    if (d2 < 14000) { const f = (1 - d2 / 14000) * .9, d = Math.sqrt(d2) || 1; m.x += dx / d * f; m.y += dy / d * f; } // close to the mouse? push the dot away
    if (!reduce) { m.x += m.vx; m.y += m.vy; }      // drift (skipped if the visitor wants reduced motion)
    if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; } // left through the top? re-enter at the bottom
    if (m.x < -6) m.x = W + 6; if (m.x > W + 6) m.x = -6;   // wrap around the left/right edges
    const a = .25 + .5 * (.5 + .5 * Math.sin(t * 1.4 + m.ph)); // twinkle: opacity wobbles with a sine wave
    ctx.fillStyle = `rgba(247,226,166,${a})`;       // pale gold colour
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill(); // draw the dot as a small circle
  });

  ctx.globalCompositeOperation = 'source-over';     // reset the drawing mode
}

/* ============================================================================
   6. HERO SCROLL-ZOOM — as you scroll down the tall #hero, the spectacles
   zoom into the left lens, then the shop name appears letter by letter.
   Chain of events:
     you scroll -> readScroll() stores progress -> frame() smooths it ->
     renderHero() changes the SVG viewBox -> browser redraws = zoom.
   ============================================================================ */
const hero = $('#hero'), svg = $('#glasses'), glow = $('#glow'), tag = $('#tagline'), hint = $('#hint'), frameG = $('#frameG'), nav = $('#nav'); // grab the elements we animate
const stage = hero.querySelector('.stage');         // the pinned screen inside #hero
const LENS = { x: 240, y: 155 };                    // centre of the LEFT lens inside the SVG's own 800 x 300 drawing space
let vw = 1, vh = 1, W0 = 1300, Wf = 200, target = 0, sp = 0, lastKey = ''; // vw/vh = SVG size on screen; W0 = start zoom width; Wf = end zoom width; target = real scroll progress (0-1); sp = smoothed progress; lastKey = remembers last text-reveal state

// measureHero(): works out the zoom START width (W0, whole glasses visible) and END width (Wf, only the lens) for this screen size.
function measureHero() {
  const r = svg.getBoundingClientRect();            // size of the SVG on screen
  vw = r.width || innerWidth; vh = r.height || innerHeight; // use window size if it reads 0
  const frac = vw < 700 ? .9 : .58;                 // phones: glasses fill 90% of the width; larger screens: 58%
  W0 = 800 / frac;                                  // start viewBox width (800 = glasses width in the drawing)
  Wf = Math.min(200, 118 * vw / vh);                // end viewBox width: small enough to sit fully INSIDE the lens
}

// BACKUP PINNING (mobile fix) ---------------------------------------------------
// Normally CSS "sticky" keeps the stage on screen. A few phone browsers break sticky.
// checkPin() notices that (the stage scrolls away when it should stay) and pins it with JS instead.
let pinMode = 'sticky';                             // 'sticky' = normal; 'js' = backup mode
let pinStrikes = 0;                                 // how many checks in a row found sticky NOT working
function checkPin() {
  const scrolled = -hero.getBoundingClientRect().top;        // pixels scrolled into the hero
  const dist = hero.offsetHeight - stage.offsetHeight;       // total scroll length of the hero
  if (pinMode === 'sticky') {                                // still trusting CSS sticky?
    if (scrolled > 40 && scrolled < dist - 40) {             // only test in the middle of the hero (avoid the edges)
      const stageTop = stage.getBoundingClientRect().top;    // where the stage is on screen (should be ~0 if pinned)
      pinStrikes = Math.abs(stageTop) > 12 ? pinStrikes + 1 : 0; // not at the top? count a strike; otherwise reset
      if (pinStrikes >= 3) pinMode = 'js';                   // 3 strikes in a row -> sticky is broken, use backup
    }
    if (pinMode === 'sticky') return;                        // sticky is fine; nothing more to do
  }
  stage.classList.remove('js-top', 'js-fixed', 'js-done');   // backup mode: clear old pin classes...
  stage.classList.add(scrolled <= 0 ? 'js-top' : scrolled >= dist ? 'js-done' : 'js-fixed'); // ...and add the right one for this scroll position
}

// readScroll(): converts "how far scrolled through #hero" into target (0 = start, 1 = finished).
function readScroll() {
  const top = hero.getBoundingClientRect().top;     // hero's top edge vs the screen top (negative once scrolled)
  const viewportHeight = stage.getBoundingClientRect().height; // height of the pinned screen
  const scrollDistance = hero.offsetHeight - viewportHeight;   // how many pixels the zoom lasts
  target = clamp(-top / Math.max(1, scrollDistance));          // progress 0-1 (Math.max avoids dividing by zero)
  checkPin();                                       // make sure the stage really is pinned
}

// renderHero(p, t): draws ONE frame of the zoom for progress p (0-1) at time t seconds.
function renderHero(p, t) {
  const z = ease(clamp(p / .7));                    // zoom amount 0-1; the zoom finishes at p = 0.7, leaving 0.7-1 for the name reveal
  const w = W0 * Math.pow(Wf / W0, z);              // viewBox width: shrinks from W0 to Wf (exponential = feels natural)
  const h = w * vh / vw;                            // matching height (keeps the screen's shape)
  const bob = reduce ? 0 : Math.sin(t * .9) * 4 * (1 - z); // tiny idle up-down wobble that fades out as we zoom
  const cx = 400 + (LENS.x - 400) * z;              // viewBox centre X: moves from the middle (400) to the lens centre
  const cy = 150 + (LENS.y - 150) * z + bob;        // viewBox centre Y: same idea
  svg.setAttribute('viewBox', `${(cx - w / 2).toFixed(2)} ${(cy - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`); // THIS LINE IS THE ZOOM: a smaller viewBox = a closer look

  frameG.style.opacity = (1 - smooth(clamp((p - .58) / .18))).toFixed(3); // fade the spectacles drawing OUT near the end of the zoom
  glow.style.opacity = smooth(clamp((p - .3) / .4)).toFixed(3);           // fade the golden glow IN partway through
  hint.style.opacity = (1 - clamp(p / .05)).toFixed(3);                   // hide the "scroll/swipe" hint right after scrolling starts

  const q = clamp((p - .6) / .26);                  // name-reveal progress 0-1 (starts at p = 0.6)
  const n = letters.length;                         // number of letters
  const key = q.toFixed(3);                         // rounded value, used to skip repeat work
  if (key !== lastKey) {                            // only redo the letters when progress actually changed
    lastKey = key;
    letters.forEach((el, i) => {                    // for each letter span...
      const k = clamp((q * (n + 5) - i) / 5);       // its own 0-1 progress (letters start one after another)
      el.style.opacity = k.toFixed(3);              // fade in
      el.style.transform = `translateY(${((1 - k) * .45).toFixed(3)}em) scale(${(.88 + .12 * k).toFixed(3)})`; // rise up and grow slightly
      el.style.filter = k < 1 ? `blur(${((1 - k) * 12).toFixed(1)}px)` : 'none'; // start blurry, become sharp
    });
    const tq = clamp((q - .8) / .2);                // tagline progress (appears after most letters are in)
    tag.style.opacity = tq.toFixed(3);              // fade the tagline in
    tag.style.transform = `translateY(${((1 - tq) * 14).toFixed(1)}px)`; // and slide it up a little
  }

  nav.classList.toggle('show', p > .92);            // slide the nav bar in once the intro is basically finished
}

/* ------------------------------ main animation loop ------------------------------ */
// NOTE (mobile fix): the zoom is NOT switched off for "reduce motion" any more. It moves only when the
// visitor scrolls (they control it), so it is safe; only the endless decorative loops are turned off.
measureHero(); readScroll();                        // work out sizes and the starting progress
sp = target;                                        // start the smoothed value at the real value (no jump)

// Re-measure when the screen changes: window resize, phone rotation, and the phone's address bar showing/hiding.
const remeasure = () => { measureHero(); readScroll(); };
window.addEventListener('resize', remeasure);
window.addEventListener('orientationchange', () => requestAnimationFrame(remeasure)); // wait one frame so the new size is ready
if (window.visualViewport) window.visualViewport.addEventListener('resize', remeasure); // phone toolbar / pinch-zoom changes
window.addEventListener('scroll', readScroll, { passive: true }); // on every scroll just record the new target (the loop below draws)
document.fonts && document.fonts.ready.then(measureHero);         // re-measure once fonts have loaded

let t0 = performance.now();                         // time the page started (milliseconds)
// frame(now): the animation loop, called ~60 times a second by the browser (requestAnimationFrame).
(function frame(now) {
  const t = reduce ? 0 : (now - t0) / 1000;         // seconds since start (frozen at 0 for reduce-motion)
  sp += (target - sp) * (reduce ? 1 : .14);         // move smoothed progress 14% of the way to the real one each frame (smooth lag); reduce-motion = follow instantly
  if (Math.abs(target - sp) < .0004) sp = target;   // very close? snap to the exact value
  drawBg(t);                                        // paint the background
  renderHero(sp, t);                                // update the zoom/name for the current progress
  requestAnimationFrame(frame);                     // ask the browser to call frame() again next screen refresh
})(t0);                                             // the ( )(t0) at the end runs the loop once to start it
</script>
</body>
</html>
