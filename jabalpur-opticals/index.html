<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jabalpur Opticals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   STYLE SHEET OVERVIEW (for your teacher / for you to explain the code)
   --------------------------------------------------------------------
   - :root holds every colour, font and spacing "variable" used on the
     page (var(--gold), var(--bg), etc). Changing a value here changes
     it everywhere on the site — that is the point of CSS variables.
   - The sheet is split into labelled sections with comments like
     /* ---------- nav ---------- *\/  so you can find a part quickly.
   - Animations (@keyframes) are defined next to the rule that uses them.
   ========================================================================== */
:root{
  color-scheme: dark;
  --bg:#000;
  --ink:#efe8d8;
  --muted:#a39b87;
  --gold:#e6b24c;
  --gold-hi:#f7e2a6;
  --gold-lo:#9a6a1c;
  --line:rgba(230,178,76,.24);
  --panel:rgba(10,8,3,.62);
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
a{color:inherit}

/* ---------- moving background ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}

/* ---------- nav ---------- */
#nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:calc(env(safe-area-inset-top,0px) + .9rem) 5vw 1.6rem;
  background:linear-gradient(#000 20%,rgba(0,0,0,0));
  transform:translateY(-110%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
#nav.show{transform:none}
#nav .logo{font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase;text-decoration:none;color:var(--gold-hi)}
#nav .links{display:flex;gap:1.6rem;font-size:.95rem}
#nav .links a{text-decoration:none;color:var(--muted);transition:color .2s}
#nav .links a:hover{color:var(--gold-hi)}
@media(max-width:560px){#nav .links{gap:1rem;font-size:.85rem}#nav .logo{font-size:1.1rem}}

/* ---------- hero (pinned zoom) ---------- */
/* #hero is made very tall (390vh). Because .stage inside it is
   "position:sticky", the viewport stays locked on the glasses while
   you scroll through that extra height — that scroll distance is
   what the JS (renderHero) reads to drive the zoom animation. */
#hero{position:relative;z-index:1;height:390vh;height:390svh}
#hero .stage{position:sticky;top:0;height:100vh;height:100svh;height:100dvh;overflow:hidden}
#hero .stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 42%,rgba(0,0,0,.7) 100%)}
#glasses{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,rgba(230,178,76,.28),rgba(230,178,76,.06) 38%,transparent 62%)}
.brand{position:absolute;inset:0;z-index:2;display:grid;place-content:center;justify-items:center;text-align:center;padding:0 5vw;pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3.6rem,11vw,9rem);line-height:1;letter-spacing:.01em;text-transform:uppercase}
.word{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;
  background:linear-gradient(100deg,#9a6a1c 0%,#e6b24c 25%,#fff3c9 50%,#e6b24c 75%,#9a6a1c 100%);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shine 4.5s linear infinite;animation-delay:calc(var(--i) * -.16s)}
@keyframes shine{from{background-position:150% 0}to{background-position:-150% 0}}
.brand p{margin:1.2rem 0 0;max-width:34ch;font-size:clamp(1rem,2.2vw,1.25rem);color:var(--ink);opacity:0}
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 2rem);z-index:3;text-align:center;color:var(--muted);font-size:.95rem;pointer-events:none}
.hint i{display:block;width:1px;height:38px;margin:.7rem auto 0;background:linear-gradient(var(--gold),transparent);animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.sweep{animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-260px)}100%{transform:translateX(320px)}}
#hero.static{height:100svh;height:100dvh}
#hero.static #glasses{display:block}
#hero.static .hint{display:none}

/* ---------- sections ---------- */
main{position:relative;z-index:1}
.sec{max-width:1180px;margin:0 auto;padding:clamp(4.5rem,10vw,8.5rem) 6vw}
.sec h2{margin:0 0 1rem;font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,7vw,5rem);line-height:1;text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(100deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec .intro{margin:0 0 2.4rem;max-width:56ch;color:var(--muted);font-size:1.1rem}

/* tabs */
.tablist{position:relative;display:flex;gap:clamp(1.2rem,4vw,2.6rem);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tablist::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;padding:.9rem 0;font:600 1.05rem var(--body);color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--gold-hi)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--gold);transition:transform .38s cubic-bezier(.3,.8,.2,1),width .38s cubic-bezier(.3,.8,.2,1)}
.panel{position:relative;margin-top:1.6rem;padding:clamp(1.5rem,4.5vw,3.2rem);border:1px solid var(--line);border-radius:14px;background:var(--panel);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(1.5rem,5vw,4rem);overflow:hidden;--mx:50%;--my:0%}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),rgba(230,178,76,.16),transparent 60%);transition:opacity .3s}
.panel>*{position:relative}
.panel h3{margin:0 0 .9rem;font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.05;text-transform:uppercase;color:var(--ink)}
.panel p{margin:0 0 1rem;color:var(--muted);max-width:52ch}
.rows{list-style:none;margin:0;padding:0;align-self:start}
.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:1.2rem;padding:.95rem 0;border-bottom:1px solid var(--line);animation:rowIn .45s cubic-bezier(.2,.7,.2,1) both}
.rows li:first-child{padding-top:0}
.rows b{font-weight:600;font-size:1.05rem}
.rows span{color:var(--muted);text-align:right;font-size:.98rem}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:820px){.panel{grid-template-columns:1fr}}

/* ---------- gallery (shop photos) ---------- */
/* Each photo is a <figure> containing an <img>. If the image file
   named in SHOP.gallery (see the script below) is not found, the
   browser fires the img's onerror handler, which adds the ".ph"
   class to the <figure> — that swaps in a dashed placeholder box
   so the page still looks tidy before you've added real photos. */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.2rem}
.gallery-grid figure{position:relative;margin:0;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.gallery-grid img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-grid figcaption{position:absolute;left:.8rem;bottom:.8rem;padding:.35rem .75rem;border-radius:999px;background:rgba(0,0,0,.7);border:1px solid var(--line);font-size:.8rem;color:var(--gold-hi)}
.gallery-grid .ph-label{display:none}
.gallery-grid figure.ph{border-style:dashed}
.gallery-grid figure.ph img{display:none}
.gallery-grid figure.ph figcaption{display:none}
.gallery-grid figure.ph .ph-label{display:flex;align-items:center;justify-content:center;text-align:center;height:100%;padding:1.2rem;color:var(--muted);font-size:.85rem;line-height:1.5}
.gallery-grid figure.ph .ph-label code{display:block;margin-top:.4rem;color:var(--gold-hi);font-size:.85rem}

/* ---------- visit ---------- */
.visit{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:start}
address{font-style:normal;font-size:clamp(1.3rem,3vw,1.75rem);line-height:1.4;margin-bottom:1.8rem}
.contact{list-style:none;margin:0 0 2rem;padding:0}
.contact li{display:flex;gap:1.2rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.contact li>span{flex:0 0 6.2rem;color:var(--muted)}
.contact a{text-decoration:none}
.contact a:hover{color:var(--gold-hi)}
.btns{display:flex;flex-wrap:wrap;gap:.8rem}
.btn{display:inline-block;appearance:none;border:1px solid var(--gold);border-radius:10px;padding:.85rem 1.5rem;font:600 1rem var(--body);text-decoration:none;cursor:pointer;color:var(--gold-hi);background:transparent;transition:background .2s,color .2s,transform .15s}
.btn:hover{background:rgba(230,178,76,.12)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:linear-gradient(120deg,var(--gold-hi),var(--gold) 55%,#c98f2a);color:#1a1204;border-color:transparent}
.btn.solid:hover{background:linear-gradient(120deg,#fff3c9,#f0c060 55%,#d99b30)}
.mapcard{display:block;position:relative;aspect-ratio:4/3;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;background:#090703}
.mapcard svg{position:absolute;inset:0;width:100%;height:100%}
.mapcard .cap{position:absolute;left:1rem;bottom:1rem;padding:.5rem .9rem;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-size:.92rem;color:var(--gold-hi)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@media(max-width:820px){.visit{grid-template-columns:1fr}}

/* ---------- enquiry ---------- */
.enq{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,6vw,5rem);align-items:start}
form{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 1.2rem;padding:clamp(1.3rem,4vw,2.4rem);border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.field{display:flex;flex-direction:column;gap:.4rem}
.field.full{grid-column:1/-1}
label{font-size:.95rem;color:var(--muted)}
input,select,textarea{width:100%;font:400 1rem var(--body);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:.85rem 1rem;transition:border-color .2s,background .2s}
input:hover,select:hover,textarea:hover{border-color:rgba(230,178,76,.5)}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:rgba(230,178,76,.06);outline:none;box-shadow:0 0 0 3px rgba(230,178,76,.2)}
select option{background:#100c04;color:var(--ink)}
textarea{min-height:120px;resize:vertical}
.status{grid-column:1/-1;margin:0;min-height:1.4em;color:var(--gold-hi);font-size:.97rem}
form .btn{justify-self:start}
@media(max-width:820px){.enq{grid-template-columns:1fr}}
@media(max-width:520px){form{grid-template-columns:1fr}}

footer{position:relative;z-index:1;border-top:1px solid var(--line);padding:2.4rem 6vw calc(env(safe-area-inset-bottom,0px) + 2.4rem);text-align:center;color:var(--muted);font-size:.95rem;background:linear-gradient(transparent,rgba(0,0,0,.7))}
footer strong{font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;color:var(--gold-hi);display:block;margin-bottom:.3rem}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .ch,.hint i,.sweep,.pulse{animation:none}
  .rows li{animation:none}
}
</style>
</head>
<body id="top">

<canvas id="bg" aria-hidden="true"></canvas>

<nav id="nav" aria-label="Main">
  <a class="logo" href="#top" id="navLogo">Jabalpur Opticals</a>
  <div class="links">
    <a href="#about">About</a>
    <a href="#gallery">Gallery</a>
    <a href="#visit">Visit</a>
    <a href="#enquiry">Enquiry</a>
  </div>
</nav>

<!-- ============ HERO: scroll to zoom into the frame ============ -->
<header id="hero">
  <div class="stage">
    <svg id="glasses" viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A pair of gold spectacles">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff0bd"/>
          <stop offset=".4" stop-color="#e6b24c"/>
          <stop offset="1" stop-color="#8a5a12"/>
        </linearGradient>
        <linearGradient id="lensFill" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e6b24c" stop-opacity=".16"/>
          <stop offset="1" stop-color="#e6b24c" stop-opacity=".02"/>
        </linearGradient>
        <linearGradient id="glare" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff6d8" stop-opacity=".3"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="clipL"><rect x="95" y="70" width="290" height="170" rx="70" ry="60"/></clipPath>
        <clipPath id="clipR"><rect x="415" y="70" width="290" height="170" rx="70" ry="60"/></clipPath>
      </defs>
      <g id="frameG">
        <!-- lens glass -->
        <rect x="95" y="70" width="290" height="170" rx="70" ry="60" fill="url(#lensFill)"/>
        <rect x="415" y="70" width="290" height="170" rx="70" ry="60" fill="url(#lensFill)"/>
        <g clip-path="url(#clipL)"><g class="sweep"><polygon points="120,60 175,60 115,250 60,250" fill="url(#glare)"/><polygon points="200,60 214,60 154,250 140,250" fill="url(#glare)"/></g></g>
        <g clip-path="url(#clipR)"><g class="sweep" style="animation-delay:.25s"><polygon points="440,60 495,60 435,250 380,250" fill="url(#glare)"/><polygon points="520,60 534,60 474,250 460,250" fill="url(#glare)"/></g></g>
        <!-- soft glow under the frame -->
        <g fill="none" stroke="#e6b24c" stroke-opacity=".14" stroke-width="26" stroke-linecap="round">
          <rect x="95" y="70" width="290" height="170" rx="70" ry="60"/>
          <rect x="415" y="70" width="290" height="170" rx="70" ry="60"/>
        </g>
        <!-- frame -->
        <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
          <rect x="95" y="70" width="290" height="170" rx="70" ry="60" stroke-width="12"/>
          <rect x="415" y="70" width="290" height="170" rx="70" ry="60" stroke-width="12"/>
          <path d="M385 128 C394 98 406 98 415 128" stroke-width="10"/>
          <path d="M387 150 Q400 138 413 150" stroke-width="4"/>
          <path d="M96 102 C62 98 34 94 14 84" stroke-width="9"/>
          <path d="M704 102 C738 98 766 94 786 84" stroke-width="9"/>
          <path d="M388 200 q-9 14 -2 27" stroke-width="3"/>
          <path d="M412 200 q9 14 2 27" stroke-width="3"/>
        </g>
        <g fill="none" stroke="#fff3c9" stroke-opacity=".38" stroke-width="1.6">
          <rect x="103" y="78" width="274" height="154" rx="62" ry="52"/>
          <rect x="423" y="78" width="274" height="154" rx="62" ry="52"/>
        </g>
        <circle cx="95" cy="102" r="8" fill="url(#gold)"/>
        <circle cx="705" cy="102" r="8" fill="url(#gold)"/>
      </g>
    </svg>

    <div class="glow" id="glow"></div>

    <div class="brand">
      <h1 id="shopName" aria-label="Jabalpur Opticals"></h1>
      <p id="tagline"></p>
    </div>

    <div class="hint" id="hint">Scroll to step inside<i></i></div>
  </div>
</header>

<main>
  <!-- ============ ABOUT (tabs) ============ -->
  <section class="sec" id="about" aria-labelledby="aboutTitle">
    <h2 id="aboutTitle"></h2>
    <p class="intro" id="aboutIntro"></p>
    <div class="tablist" role="tablist" id="tablist" aria-label="About the shop"></div>
    <div class="panel" id="panel" role="tabpanel" tabindex="0"></div>
  </section>

  <!-- ============ GALLERY (shop photos) ============ -->
  <!-- Photos are listed in SHOP.gallery (bottom of the <script>).
       Put your actual shop photos inside the "images" folder with
       the exact file names used there (shop-1.jpg, shop-2.jpg, ...). -->
  <section class="sec" id="gallery" aria-labelledby="galleryTitle">
    <h2 id="galleryTitle"></h2>
    <p class="intro" id="galleryIntro"></p>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>

  <!-- ============ VISIT ============ -->
  <section class="sec" id="visit" aria-labelledby="visitTitle">
    <h2 id="visitTitle"></h2>
    <p class="intro" id="visitIntro"></p>
    <div class="visit">
      <div>
        <address id="addr"></address>
        <ul class="contact" id="contact"></ul>
        <div class="btns">
          <a class="btn solid" id="dirBtn" target="_blank" rel="noopener">Get directions</a>
          <a class="btn" id="callBtn">Call the shop</a>
        </div>
      </div>
      <a class="mapcard" id="mapCard" target="_blank" rel="noopener" aria-label="Open the shop location in Google Maps">
        <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e6b24c" stroke-opacity=".08"/></pattern></defs>
          <rect width="400" height="300" fill="url(#grid)"/>
          <g fill="none" stroke="#e6b24c" stroke-opacity=".28" stroke-width="7" stroke-linecap="round">
            <path d="M-10 220 C90 200 140 120 230 130 S360 60 420 40"/>
            <path d="M60 320 C90 220 170 190 200 150 S250 40 240 -10"/>
          </g>
          <g fill="none" stroke="#e6b24c" stroke-opacity=".14" stroke-width="3" stroke-linecap="round">
            <path d="M-10 90 L420 170"/><path d="M300 320 L360 -10"/><path d="M-10 270 L300 250"/>
          </g>
          <circle class="pulse" cx="200" cy="145" r="26" fill="#e6b24c" fill-opacity=".35"/>
          <path d="M200 176 C182 152 176 142 176 130 a24 24 0 1 1 48 0 c0 12 -6 22 -24 46z" fill="url(#gold)"/>
          <circle cx="200" cy="130" r="9" fill="#120d03"/>
        </svg>
        <span class="cap">Open in Google Maps</span>
      </a>
    </div>
  </section>

  <!-- ============ ENQUIRY ============ -->
  <section class="sec" id="enquiry" aria-labelledby="enqTitle">
    <div class="enq">
      <div>
        <h2 id="enqTitle"></h2>
        <p class="intro" id="enqIntro"></p>
      </div>
      <form id="form">
        <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" autocomplete="name" required></div>
        <div class="field"><label for="f-phone">Phone number</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" required></div>
        <div class="field full"><label for="f-need">What are you looking for?</label><select id="f-need" name="need"></select></div>
        <div class="field full"><label for="f-msg">Message (optional)</label><textarea id="f-msg" name="message"></textarea></div>
        <button class="btn solid" type="submit" id="sendBtn">Send enquiry</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <strong id="footName"></strong>
  <span id="footLine"></span>
</footer>

<script>
/* ==========================================================================
   JAVASCRIPT OVERVIEW (read this first — useful for explaining the code)
   --------------------------------------------------------------------
   The script below has 5 parts, in this order:

     1. SHOP               — one plain object holding every piece of text,
                              contact detail and list used on the page.
                              Editing THIS object is how you change the
                              site's content without touching any HTML.
     2. helpers             — small reusable functions used everywhere else
                              ($ , clamp , smooth , ease , esc , reduce).
     3. "fill content"      — takes the text out of SHOP and writes it into
                              the empty elements in the HTML above
                              (e.g. document.title, the nav logo, etc).
     4. tabs / gallery /    — small self-contained features. Each one is
        form submit           wrapped in its own function so it doesn't
                              leak variables into the rest of the script.
     5. moving background   — the animated canvas behind everything, and
        + hero scroll zoom     the scroll-driven zoom into the spectacles.
   ========================================================================== */

const SHOP = {
  name: "Jabalpur Opticals",
  tagline: "Eye tests, frames and lenses, all under one roof.",

  phone: "+91 00000 00000",
  whatsapp: "910000000000",              // country code + number, no + or spaces
  email: "hello@yourshop.com",
  hoursSummary: "Mon to Sat, 10:00 am to 9:00 pm",

  // Shop address — shown under "Visit us" and used to build the
  // Google Maps link. Each array entry is printed on its own line.
  address: [
    "Tularam Chowk, Jabalpur Road",
    "Near Aaga Chowk",
    "Jabalpur - 482002, Madhya Pradesh"
  ],
  // What gets typed into Google Maps' search box when someone taps
  // "Get directions" — keep this as one plain-text line.

/* ------------------------------ helpers ------------------------------ */
// $(selector) — shortcut for document.querySelector, used everywhere
// below instead of writing "document.querySelector" every time.
const $ = s => document.querySelector(s);

// clamp(value, min, max) — forces a number to stay between min and
// max. Used a lot in the scroll animation so values never go
// outside the 0–1 range they are meant to represent.
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

// smooth(t) — a 0→1 "ease" curve (slow, fast, slow) used to make
// fade/opacity changes feel less mechanical than a straight line.
const smooth = t => t * t * (3 - 2 * t);

// ease(t) — a stronger "ease-in-out" curve, used for the zoom speed
// itself so it accelerates then decelerates instead of moving at a
// constant speed.
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// esc(text) — "escapes" HTML special characters (<, >, &, quotes)
// before inserting user-supplied or config text into innerHTML.
// This stops a stray "<" in SHOP data (or form input) from being
// misread as the start of an HTML tag.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// reduce — true if the visitor's operating system has "reduce
// motion" turned on (an accessibility setting). When true, the
// script skips scroll-linked animation and just shows the final
// state immediately.
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

    word.appendChild(s); letters.push(s);

  h1.appendChild(word);
  if (wi < arr.length - 1) h1.appendChild(document.createTextNode(' ')); // keep a real space between words

/* ------------------------------ tabs (About section) ------------------------------ */
// Wrapped in an IIFE — "Immediately Invoked Function Expression" —
// i.e. a function that runs itself once, right here. This is just a
// way to keep "list", "panel", "btns" etc as private variables that
// don't clash with names used elsewhere in the file.
(function () {
  const list = $('#tablist'), panel = $('#panel');
  const ind = document.createElement('span'); ind.className = 'ind'; list.appendChild(ind); // the gold underline that slides between tabs

  // Build one <button> per tab, from SHOP.tabs.
  const btns = SHOP.tabs.map((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.role = 'tab'; b.id = 'tab' + i;
    b.textContent = t.label; b.setAttribute('aria-controls', 'panel');
    b.addEventListener('click', () => select(i));
    // Left/Right arrow keys move between tabs — standard accessible
    // "tablist" keyboard behaviour.
    b.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); select((i + 1) % btns.length, true); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); select((i - 1 + btns.length) % btns.length, true); }
    });
    list.insertBefore(b, ind);
    return b;
  });

  // select(i) — switches the visible tab to index i, and redraws the
  // panel's content (heading, paragraphs, list rows) from SHOP.tabs[i].
  function select(i, focus) {
    const t = SHOP.tabs[i];
    btns.forEach((b, k) => { b.setAttribute('aria-selected', k === i); b.tabIndex = k === i ? 0 : -1; });
    panel.setAttribute('aria-labelledby', 'tab' + i);
    const paras = Array.isArray(t.text) ? t.text : [t.text]; // allow text to be one string OR an array of paragraphs
    panel.innerHTML =
      `<div><h3>${esc(t.heading)}</h3>${paras.map(p => `<p>${esc(p)}</p>`).join('')}</div>` +
      `<ul class="rows">${(t.list || []).map((r, k) =>
        `<li style="animation-delay:${k * 60}ms"><b>${esc(r.title)}</b>${r.note ? `<span>${esc(r.note)}</span>` : ''}</li>`).join('')}</ul>`;
    // Move the gold underline (.ind) under the newly selected tab button.
    const b = btns[i];
    ind.style.width = b.offsetWidth + 'px';
    ind.style.transform = `translateX(${b.offsetLeft}px)`;
    if (focus) b.focus();
  }
  select(0); // show the first tab by default

  // Keep the underline lined up correctly if the window is resized,
  // or once the custom font has finished loading (letter widths can
  // shift slightly once the real font swaps in).
  addEventListener('resize', () => { const cur = btns.findIndex(b => b.getAttribute('aria-selected') === 'true'); const b = btns[cur]; ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; });
  document.fonts && document.fonts.ready.then(() => { const cur = btns.findIndex(b => b.getAttribute('aria-selected') === 'true'); const b = btns[cur]; ind.style.width = b.offsetWidth + 'px'; ind.style.transform = `translateX(${b.offsetLeft}px)`; });

  // "Spotlight" effect: track the mouse position over the panel and
  // store it in two CSS variables (--mx, --my) that the .panel::before
  // radial-gradient in the CSS reads to draw a soft light that
  // follows the cursor.
  panel.addEventListener('pointermove', e => {
    const r = panel.getBoundingClientRect();
    panel.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    panel.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
})();

// This runs when the visitor clicks "Send enquiry".
$('#form').addEventListener('submit', async e => {
  e.preventDefault();                         // stop the browser's normal full-page-reload form submit
  const d = Object.fromEntries(new FormData(e.target)); // gather all the input values into a plain object, e.g. {name, phone, need, message}
  const status = $('#status'), btn = $('#sendBtn');
  // A ready-made WhatsApp message, used only in the "no PHP backend"
  // fallback further down.
  const text = `Hello ${SHOP.name}, my name is ${d.name}. I am looking for: ${d.need}.` +
               (d.message ? ` ${d.message}` : '') + ` My phone number is ${d.phone}.`;

  if (SHOP.formEndpoint) {
    // ---- PHP + MySQL path ----
    // Sends the form data as JSON to php/enquiry.php using fetch().
    // enquiry.php reads this JSON, validates it, and INSERTs it into
    // the "enquiries" table in MySQL (see /php/enquiry.php and
    // /sql/schema.sql for the matching backend code).
    btn.disabled = true; status.textContent = 'Sending…';
    try {
      const r = await fetch(SHOP.formEndpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(d)
      });
      const reply = await r.json();           // enquiry.php always replies with JSON, e.g. {success:true}
      if (!r.ok || !reply.success) throw new Error(reply.error || 'bad status');
      status.textContent = 'Thank you. We will call you back soon.';
      e.target.reset();                       // clear the form fields after a successful save
    } catch (err) {
      status.textContent = `Could not send the enquiry. Please call us on ${SHOP.phone}.`;
    }
    btn.disabled = false;
    return;
  }

  // ---- WhatsApp fallback path ----
  // Only runs if SHOP.formEndpoint is left empty. Opens WhatsApp Web /
  // app in a new tab with the message already typed in.
  const url = `https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank', 'noopener');
  status.innerHTML = `Opening WhatsApp with your message. <a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Tap here if it did not open</a>.`;
});


/* ============================================================================
   MOVING BACKGROUND — an animated <canvas> painted behind everything else.
   It draws, every frame: a solid black fill, a few soft glowing "blobs"
   that drift slowly, two faint light "beams" that sway, and a field of
   small floating dots ("motes") that drift upward and are gently pushed
   away from the mouse pointer.
   ============================================================================ */
const cv = $('#bg'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, motes = [];
const mouse = { x: -999, y: -999 }; // starts off-screen so nothing reacts before the first mouse move

// Each blob: c = RGB colour, a = max opacity, r = radius (relative to
// screen size), x/y = starting position (0–1 of width/height),
// ax/ay = how far it drifts, sx/sy = how fast it drifts.
const blobs = [
  { c: '230,178,76', a: .16, r: .55, x: .25, y: .3, ax: .18, ay: .12, sx: .11, sy: .08 },
  { c: '150,96,20',  a: .22, r: .7,  x: .8,  y: .7, ax: .15, ay: .18, sx: .07, sy: .1 },
  { c: '255,226,150', a: .07, r: .4, x: .55, y: .5, ax: .3,  ay: .2,  sx: .05, sy: .06 }
];
// Each beam: x = position across the screen, base/sw = swing angle,
// spread = how wide the beam fans out, a = opacity, sp = swing speed.
const beams = [
  { x: .3, base: .16, sw: .22, spread: .16, a: .13, sp: .23 },
  { x: .72, base: -.2, sw: .2, spread: .13, a: .09, sp: .17 }
];

// sizeCanvas() — (re)creates the canvas at the correct pixel size for
// the current window, and rebuilds the "motes" particle list to match
// the new screen area. Runs once at the start and again on resize.
function sizeCanvas() {
  if (W && innerWidth === W && Math.abs(innerHeight - H) < 150) return; // skip tiny mobile-browser resize jitters
  DPR = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const n = Math.round(clamp(W * H / 15000, 40, 110)); // more screen area = more dots, within sensible limits
  motes = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: .5 + Math.random() * 1.7,
    vy: -(.04 + Math.random() * .2), vx: (Math.random() - .5) * .1, ph: Math.random() * 6.28
  }));
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });

// drawBg(t) — draws one frame of the background. "t" is the elapsed
// time in seconds, used so the blobs/beams/motes keep moving smoothly
// rather than jumping from frame to frame.
function drawBg(t) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);       // paint the base black background
  ctx.globalCompositeOperation = 'lighter';                // "lighter" makes overlapping glows add up into brighter light, like real light does

  const L = Math.max(W, H);
  // Draw each glowing blob as a radial gradient circle.
  blobs.forEach((b, i) => {
    const x = W * (b.x + Math.sin(t * b.sx + i) * b.ax), y = H * (b.y + Math.cos(t * b.sy + i * 2) * b.ay), r = L * b.r;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${b.c},${b.a})`); g.addColorStop(1, `rgba(${b.c},0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  });

  // Draw each light beam as a tall, slowly-swaying triangle fan.
  beams.forEach((b, i) => {
    ctx.save(); ctx.translate(W * b.x, -30); ctx.rotate(b.base + Math.sin(t * b.sp + i * 2) * b.sw);
    const len = H * 1.5, sp = len * b.spread;
    const g = ctx.createLinearGradient(0, 0, 0, len);
    g.addColorStop(0, `rgba(255,226,150,${b.a})`); g.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(6, 0); ctx.lineTo(sp, len); ctx.lineTo(-sp, len); ctx.closePath(); ctx.fill();
    ctx.restore();
  });

  // Update and draw every floating dot ("mote").
  motes.forEach(m => {
    // Push the dot away from the mouse pointer if it is close by.
    const dx = m.x - mouse.x, dy = m.y - mouse.y, d2 = dx * dx + dy * dy;
    if (d2 < 14000) { const f = (1 - d2 / 14000) * .9, d = Math.sqrt(d2) || 1; m.x += dx / d * f; m.y += dy / d * f; }
    if (!reduce) { m.x += m.vx; m.y += m.vy; }           // drift slowly upward/sideways
    if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; } // wrap back in at the bottom once it drifts off the top
    if (m.x < -6) m.x = W + 6; if (m.x > W + 6) m.x = -6;   // wrap left/right too
    const a = .25 + .5 * (.5 + .5 * Math.sin(t * 1.4 + m.ph)); // gentle twinkle via a sine wave
    ctx.fillStyle = `rgba(247,226,166,${a})`; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  });

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================================
   HERO SCROLL-ZOOM — makes the spectacles grow and move as you scroll
   down through the (very tall) #hero element, "zooming" into the left
   lens, then revealing the shop name letter by letter once fully zoomed.
   ============================================================================ */
const hero = $('#hero'), svg = $('#glasses'), glow = $('#glow'), tag = $('#tagline'), hint = $('#hint'), frameG = $('#frameG'), nav = $('#nav');
const LENS = { x: 240, y: 155 };           // the (x, y) centre of the LEFT lens, in the SVG's own 800x300 coordinate space
let vw = 1, vh = 1, W0 = 1300, Wf = 200, target = 0, sp = 0, lastKey = '';

// measureHero() — works out the SVG "viewBox" width to start from
// (W0, showing both lenses) and to zoom in to (Wf, filling the
// screen with just the left lens), based on the current screen size.
function measureHero() {
  const r = svg.getBoundingClientRect(); vw = r.width || innerWidth; vh = r.height || innerHeight;
  const frac = vw < 700 ? .9 : .58;        // on narrow phone screens, start a bit more "zoomed in" already
  W0 = 800 / frac;
  Wf = Math.min(200, 118 * vw / vh);       // final window sized so it always fits fully inside the lens shape
}

// readScroll() — converts "how far down the #hero element the user
// has scrolled" into a 0–1 progress value stored in "target".
// 0 = top of the hero (not scrolled into it yet), 1 = fully scrolled
// through it (zoom animation complete).
function readScroll() {
  if (reduce) { target = 1; return; }       // skip straight to the end state if the visitor prefers reduced motion
  const top = hero.getBoundingClientRect().top;
  const stage = hero.querySelector('.stage');
  const viewportHeight = stage ? stage.getBoundingClientRect().height : document.documentElement.clientHeight;
  const scrollDistance = hero.offsetHeight - viewportHeight; // the extra scrollable height built into #hero (390vh - 100vh)
  target = clamp(-top / Math.max(1, scrollDistance));
}

// renderHero(p, t) — draws one frame of the zoom animation for
// progress value p (0–1, smoothed from "target", see the loop below)
// at elapsed time t (used for the small idle "bob" wobble).
function renderHero(p, t) {
  const z = ease(clamp(p / .7));            // the zoom itself finishes at p = 0.7, leaving 0.7–1 for the text reveal
  const w = W0 * Math.pow(Wf / W0, z), h = w * vh / vw; // interpolate the viewBox width/height exponentially (feels more natural than a straight line zoom)
  const bob = reduce ? 0 : Math.sin(t * .9) * 4 * (1 - z); // a small up/down drift that fades out as the zoom completes
  const cx = 400 + (LENS.x - 400) * z, cy = 150 + (LENS.y - 150) * z + bob; // move the viewBox centre from the full frame's centre towards the lens centre
  svg.setAttribute('viewBox', `${(cx - w / 2).toFixed(2)} ${(cy - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);

  frameG.style.opacity = (1 - smooth(clamp((p - .58) / .18))).toFixed(3); // fade the whole frame drawing out as we finish zooming in
  glow.style.opacity = smooth(clamp((p - .3) / .4)).toFixed(3);           // fade the warm glow in partway through the zoom
  hint.style.opacity = (1 - clamp(p / .05)).toFixed(3);                   // hide the "scroll to step inside" hint almost immediately on scroll

  // Letter-by-letter name reveal + tagline fade, only recalculated
  // when the rounded progress value actually changes (an easy way to
  // avoid redoing this work on every single animation frame).
  const q = clamp((p - .6) / .26), n = letters.length;
  const key = q.toFixed(3);
  if (key !== lastKey) {
    lastKey = key;
    letters.forEach((el, i) => {
      const k = clamp((q * (n + 5) - i) / 5);                 // each letter starts its own fade slightly after the previous one
      el.style.opacity = k.toFixed(3);
      el.style.transform = `translateY(${((1 - k) * .45).toFixed(3)}em) scale(${(.88 + .12 * k).toFixed(3)})`;
      el.style.filter = k < 1 ? `blur(${((1 - k) * 12).toFixed(1)}px)` : 'none';
    });
    const tq = clamp((q - .8) / .2);
    tag.style.opacity = tq.toFixed(3); tag.style.transform = `translateY(${((1 - tq) * 14).toFixed(1)}px)`;
  }

  nav.classList.toggle('show', p > .92);   // reveal the sticky nav bar once the hero animation has basically finished
}

/* ------------------------------ main animation loop ------------------------------ */
if (reduce) hero.classList.add('static');   // skip the scroll-zoom entirely for reduced-motion visitors
measureHero(); readScroll(); sp = reduce ? 1 : target;

window.addEventListener('resize', () => { measureHero(); readScroll(); });
window.addEventListener('orientationchange', () => {
  requestAnimationFrame(() => { measureHero(); readScroll(); });
});
window.addEventListener('scroll', readScroll, { passive: true }); // just records the new target; the loop below does the actual drawing
document.fonts && document.fonts.ready.then(() => { measureHero(); });

let t0 = performance.now();
// frame(now) — the animation loop, called roughly 60 times a second
// by requestAnimationFrame. Each call: smoothly moves "sp" (the
// animated/"eased" progress) towards "target" (the raw scroll
// progress), then redraws the background and the hero with the
// updated values.
(function frame(now) {
  const t = reduce ? 0 : (now - t0) / 1000;
  sp += (target - sp) * (reduce ? 1 : .14); // ".14" controls how quickly the animation "catches up" to the scroll position — smaller = smoother/laggier
  if (Math.abs(target - sp) < .0004) sp = target; // snap to the exact target once close enough, to avoid endless tiny redraws
  drawBg(t);
  renderHero(sp, t);
  requestAnimationFrame(frame);
})(t0);
</script>
</body>
</html>
